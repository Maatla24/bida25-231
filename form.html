    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;

        body {
            min-height: 100vh;

        .main-wrapper {

        }

        .glass-card {
            background: rgba(20, 35, 35, 0.85);

            -webkit-backdrop-filter: blur(15px);

        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group-custom input {
            width: 100%;
            padding: 15px 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        .input-group-custom input:focus {
            border-color: #1ab188;
            background: rgba(26, 177, 136, 0.05);
        }

        .strength-container {
            height: 4px;
            background: #333;
            margin: -15px 0 20px 0;
            border-radius: 2px;
            overflow: hidden;
        }

        #strengthBar {
            height: 100%;
            width: 0%;
            transition: 0.4s ease;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: #1ab188;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #159673;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(26, 177, 136, 0.3);
        }

        .toggle-icon {
            position: absolute;
            right: 15px;
            top: 18px;
            color: #1ab188;
            cursor: pointer;
        }

        footer {
    background-color: #0d1a1a; 
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding: 40px 0 20px 0;
    margin-top: 50px; 
    width: 100%;
    position: relative; 
}

.footer-content {
    display: flex;
    justify-content: space-between; 
    align-items: flex-start;
    flex-wrap: wrap;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 5%;
}

.footer-section {
    flex: 1;
    min-width: 250px; 
    margin-bottom: 30px;
    text-align: left;
}

.footer-section p {
    margin-bottom: 15px;
    font-size: 1rem;
    font-weight: 600;
    color: #1ab188;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.footer-section a {
    display: block; 
    color: #a0a0a0;
    font-size: 0.9rem;
    margin: 8px 0;
    text-decoration: none;
    transition: all 0.3s ease;
}

.footer-section a:hover {
    color: #ffffff;
    transform: translateX(5px); 
}


.social-links {
    display: flex;
    gap: 15px;
    margin-top: 10px;
}

.social-links a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,0.1);
    width: 35px;
    height: 35px;
    border-radius: 50%;
    padding: 0;
    transition: 0.3s;
}

.social-links a:hover {
    background-color: #1ab188;
    border-color: #1ab188;
    color: white;
    transform: translateY(-3px);
}


.footer-bottom {
    text-align: center;
    padding-top: 20px;
    margin-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    font-size: 0.8rem;
    color: #666;
}
        #success-ui { display: none; text-align: center; animation: fadeIn 0.8s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>

<div class="main-wrapper">
    <div class="glass-card" id="form-card">
        <h1 class="title">Join 267News</h1>
        <p class="message">Empowering your voice across Botswana.</p>

        <form id="registrationForm">
            <div class="row g-2">
                <div class="col-6 input-group-custom">
                    <input type="text" placeholder="First Name" required>
                </div>
                <div class="col-6 input-group-custom">
                    <input type="text" placeholder="Last Name" required>
                </div>
            </div>

            <div class="input-group-custom">
                <input type="email" placeholder="Email Address" required>
            </div>

            <div class="input-group-custom">
                <input type="password" id="pass" placeholder="Password" required>
            </div>

            <div class="strength-container">
                <div id="strengthBar"></div>
            </div>

            <div class="input-group-custom">
                <input type="password" id="confirmPass" placeholder="Confirm Password" required>
                <span class="toggle-icon" id="toggleVisibility">
                    <i class="far fa-eye-slash"></i>
                </span>
            </div>

            <button type="submit" class="submit-btn">Create Free Account</button>
            <p class="message mt-4">Already a member? <a href="#" style="color: #1ab188;">Sign In</a></p>
        </form>
    </div>

    <div class="glass-card" id="success-ui">
        <div style="font-size: 60px; margin-bottom: 20px;">💎</div>
        <h2 class="title">Welcome Aboard!</h2>
        <p class="message">Your account is ready. Get ready for the latest real-time insights from Gaborone and beyond.</p>
        <a href="index.html" class="submit-btn text-decoration-none d-inline-block">Go to Dashboard</a>
    </div>
</div>

<script>
    const pass = document.getElementById('pass');
    const confirmPass = document.getElementById('confirmPass');
    const strengthBar = document.getElementById('strengthBar');
    const toggle = document.getElementById('toggleVisibility');
    const form = document.getElementById('registrationForm');
    const formCard = document.getElementById('form-card');
    const successUI = document.getElementById('success-ui');

    pass.addEventListener('input', () => {
        let score = 0;
        if (pass.value.length > 7) score += 33;
        if (/[A-Z]/.test(pass.value)) score += 33;
        if (/[0-9]/.test(pass.value)) score += 34;

        strengthBar.style.width = score + "%";
        if (score < 40) strengthBar.style.backgroundColor = "#ff4d4d";
        else if (score < 80) strengthBar.style.backgroundColor = "#ffa500";
        else strengthBar.style.backgroundColor = "#1ab188";
    });

    toggle.addEventListener('click', () => {
        const type = pass.getAttribute('type') === 'password' ? 'text' : 'password';
        pass.setAttribute('type', type);
        confirmPass.setAttribute('type', type);
        toggle.querySelector('i').classList.toggle('fa-eye');
        toggle.querySelector('i').classList.toggle('fa-eye-slash');
    });

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        
        if (pass.value !== confirmPass.value) {
            alert("Passwords do not match!");
            return;
        }

 
        formCard.style.opacity = '0';
        formCard.style.transform = 'translateY(-20px)';
        
        setTimeout(() => {
            formCard.style.display = 'none';
            successUI.style.display = 'block';
        }, 500);
    });
    <footer class="sticky-footer">

        </div>

            <a href="https://youtube.com/267NewsBotswana" target="_blank">Youtube</a>
            </div>
        </div>

            <p>&copy; 2026 267NEWS Botswana</p>
        </div>

</div>
    </div>
</footer>
</script>
