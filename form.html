<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>267News | Register</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            /* Ensure the background image path is correct */
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('1338883-gaborone.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
        }

        /* --- NAVBAR REFINEMENTS --- */
        .navbar {
            background-color: #0d1a1a !important; 
            padding: 10px 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo img {
            height: 40px;
        }

        .nav-link {
            color: white !important;
            /* Matching the 'Impact' style from your home page */
            font-family: 'Impact', 'Arial Narrow Bold', sans-serif;
            font-size: 22px;
            margin-right: 20px;
            transition: 0.3s;
        }

        .signup-btn {
            background-color: white;
            color: black !important;
            padding: 8px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-family: 'Impact', sans-serif;
            font-size: 20px;
            text-transform: uppercase;
            display: inline-block;
            border: none;
            transition: 0.3s;
        }

        .signup-btn:hover {
            background-color: #cccccc;
        }

    
        @media (max-width: 991px) {
            .navbar-collapse {
                background-color: #0d1a1a;
                padding: 20px;
                text-align: center;
                border-radius: 0 0 15px 15px;
            }
            
            .nav-link {
                margin: 10px 0;
                font-size: 24px;
                display: block;
            }

            .signup-btn {
                margin-top: 15px;
                width: 100%; 
            }
        }

        .form-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            background: rgba(36, 50, 50, 0.95); 
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .title {
            font-size: 28px;
            color: #1ab188;
            font-weight: 600;
            text-align: center;
        }

        .message {
            color: #ccc;
            font-size: 14px;
            text-align: center;
            margin-bottom: 10px;
        }

        .form-group {
            display: flex;
            gap: 10px;
        }

        .form label {
            position: relative;
            width: 100%;
        }

        .form label input {
            width: 100%;
            padding: 18px 10px 6px 10px; 
            outline: none;
            border: 1px solid rgba(255,255,255,0.2);
            background: #1d2929;
            color: white;
            border-radius: 10px;
            font-size: 1rem;
        }

        .form label span {
            position: absolute;
            left: 10px;
            top: 14px;
            color: #888;
            font-size: 0.9em;
            transition: 0.3s ease;
            pointer-events: none;
        }

        
        .form label input:focus ~ span,
        .form label input:valid ~ span {
            top: 2px;
            left: 10px;
            font-size: 0.7em;
            font-weight: 600;
            color: #1ab188;
        }

        .icon {
            position: absolute;
            right: 15px;
            top: 18px;
            color: #1ab188;
            cursor: pointer;
        }

        .submit {
            border: none;
            outline: none;
            background: #1ab188;
            padding: 12px;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .submit:hover {
            background: #1ec79a;
            transform: translateY(-2px);
        }

        .signin {
            color: #fff;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
        }

        .signin a {
            color: #1ab188;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>

        <form autocomplete="off" class="form">

            <p class="title">Register</p>

            <div class="form-group">

    <script>

        const toggleBtn = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#passwordConfirm');
        toggleBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            toggleBtn.querySelector('i').classList.toggle('fa-eye');

            toggleBtn.querySelector('i').classList.toggle('fa-eye-slash');
        });

    </script>

</body>

</html>
